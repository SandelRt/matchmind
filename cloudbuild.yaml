substitutions:
  _REGION: us-central1
  _SERVICE: matchmind
  _AR_REPO: matchmind-repo

steps:
  # Build container image → Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      - build
      - -t
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$COMMIT_SHA"
      - .

  # Push to Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      - push
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$COMMIT_SHA"

  # Deploy to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - "--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$COMMIT_SHA"
      - "--region=${_REGION}"
      - --platform=managed
      - --allow-unauthenticated   # app-level auth via MATCHMIND_API_KEY (X-API-Key header)
      - --memory=1Gi
      # Single warm instance: sessions + JSON store are per-instance state.
      # Swap PredictionStore to Firestore before scaling out.
      - --min-instances=1
      - --max-instances=1
 